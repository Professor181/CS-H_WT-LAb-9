<main class="container page-shell"><div id="notice" class="notice"></div><header class="page-heading"><div><div class="eyebrow">ROSTER MANAGEMENT</div><h1>Players</h1><p>Register players and maintain their playing roles and styles.</p></div><div class="inline-controls"><select id="team-filter" aria-label="Filter players by team"><option value="">All teams</option></select></div></header><section class="form-panel"><h2 id="player-form-title" style="font:700 17px Manrope;margin:0 0 18px">Add player</h2><form id="player-form"><input id="player-id" type="hidden"><div class="form-grid"><div class="field"><label for="player-name">Player name</label><input id="player-name" required></div><div class="field"><label for="player-team">Team</label><select id="player-team" required></select></div><div class="field"><label for="role">Role</label><select id="role"><option>BATSMAN</option><option>BOWLER</option><option>ALL_ROUNDER</option><option>WICKET_KEEPER</option></select></div><div class="field"><label for="jersey">Jersey number</label><input id="jersey" type="number" min="0"></div><div class="field"><label for="batting">Batting style</label><input id="batting" placeholder="Right Hand"></div><div class="field"><label for="bowling">Bowling style</label><input id="bowling" placeholder="Right Arm Medium"></div></div><div class="form-actions"><button id="player-submit" class="btn-primary" type="submit">Save player</button><button id="player-cancel" class="btn-outline hidden" type="button">Cancel edit</button></div></form></section><div class="section-head"><h2>Player directory</h2><span id="player-count" class="count"></span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Player</th><th>Team</th><th>Role</th><th>Jersey</th><th>Batting</th><th>Bowling</th><th>Actions</th></tr></thead><tbody id="players-body"><tr><td colspan="7" class="loading">Loading players…</td></tr></tbody></table></div></main><footer class="container footer">BOUNDARY SCORE DESK &nbsp;·&nbsp; Players</footer><script src="js/app.js"></script><script src="js/players.js"></script></body></html>
